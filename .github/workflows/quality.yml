name: Repository quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in app.js admin.js functions/api/reports.js functions/api/admin/reports.js; do
            node --input-type=module --check < "$file"
          done
      - name: Check required site files
        shell: bash
        run: |
          test -s index.html
          test -s styles.css
          test -s privacy.html
          test -s terms.html
          test -s admin.html
          test -s resources.html
          test -s migrations/0001_init.sql
          test -s migrations/0002_moderation_log.sql
