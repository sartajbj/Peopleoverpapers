name: Repository quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check site.js
      - name: Check required site files
        run: |
          test -s index.html
          test -s resources.html
          test -s styles.css
          test -s site.js
          test -s privacy.html
          test -s terms.html
          test -s sitemap.xml
          test -s robots.txt
