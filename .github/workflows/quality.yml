name: Repository quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check site.js
          node --check app.js
          node --check functions/api/reports.js
          node --check functions/api/admin/reports.js
      - name: Check required site files
        run: |
          test -s index.html
          test -s resources.html
          test -s styles.css
          test -s site.js
          test -s app.js
          test -s admin.js
          test -s privacy.html
          test -s terms.html
          test -s sitemap.xml
          test -s robots.txt
          test -s migrations/0001_init.sql
          test -s functions/api/reports.js
          test -s functions/api/admin/reports.js
          test -s admin/index.html
      - name: Check map and API integration markers
        run: |
          grep -q 'id="map"' index.html
          grep -q 'id="reportForm"' index.html
          grep -q 'FROM reports' functions/api/reports.js
          grep -q 'MODERATION_TOKEN' functions/api/admin/reports.js
